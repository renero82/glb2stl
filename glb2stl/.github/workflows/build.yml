name: Build desktop apps

on:
  push:
    tags: ["v*"]          # a new tag like v2.2.0 builds and publishes the release
  workflow_dispatch:      # manual run from the Actions tab (test build, no release)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon
            target: macos-arm64
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        shell: bash
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('glb2stl/__init__.py').read()).group(1))")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION in glb2stl/__init__.py"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui.txt pyinstaller pillow

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm glb2stl.spec

      # ---------------- macOS ----------------
      - name: Selftest (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/glb2stl.app/Contents/MacOS/glb2stl --selftest selftest.txt || { cat selftest.txt; exit 1; }
          cat selftest.txt

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent dist/glb2stl.app "glb2stl-v${VERSION}-macos-arm64.zip"

      # ---------------- Windows ----------------
      - name: Selftest portable and folder builds (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($exe in @("dist\glb2stl-portable.exe", "dist\glb2stl\glb2stl.exe")) {
            $p = Start-Process -FilePath $exe -ArgumentList "--selftest", "selftest.txt" -Wait -PassThru
            Write-Host "== $exe"; Get-Content selftest.txt
            if ($p.ExitCode -ne 0) { exit 1 }
          }

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress   # installs it, or updates the preinstalled copy
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" installer\glb2stl.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Selftest installed app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = "dist\glb2stl-v$env:VERSION-windows-setup.exe"
          $dir = Join-Path $env:RUNNER_TEMP "glb2stl-test"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir", "/TASKS=assoc" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "installer failed"; exit 1 }
          $p = Start-Process -FilePath "$dir\glb2stl.exe" -ArgumentList "--selftest", "selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait -PassThru
          if ($u.ExitCode -ne 0) { Write-Host "uninstaller failed"; exit 1 }

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp "dist/glb2stl-v${VERSION}-windows-setup.exe" .
          cp dist/glb2stl-portable.exe "glb2stl-v${VERSION}-windows-portable.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: glb2stl-${{ matrix.target }}
          path: |
            glb2stl-*.zip
            glb2stl-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: glb2stl ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: artifacts/*
