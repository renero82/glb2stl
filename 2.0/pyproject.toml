[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "glb2stl"
version = "2.0.0"
description = "Convert GLB/glTF models to STL ready for 3D printing, with a CLI and a desktop GUI"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gabriele" }]
requires-python = ">=3.9"
dependencies = ["trimesh>=4.0", "numpy"]
keywords = ["3d-printing", "stl", "glb", "gltf", "miniatures"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.scripts]
glb2stl = "glb2stl.cli:main"

[project.gui-scripts]
glb2stl-gui = "glb2stl.gui:main"

[project.urls]
Homepage = "https://github.com/renero82/glb2stl"

[tool.setuptools]
packages = ["glb2stl"]
